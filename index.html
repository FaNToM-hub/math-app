<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гибридный Математический Калькулятор</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .tab { display: none; }
        .tab.active { display: block; }
        button { background: #2979ff; color: white; border: none; padding: 12px; margin: 5px 0; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%;}
        button.offline { background: #00c853; }
        input { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: white; width: 95%; font-size: 16px; }
        .result { background: #1e1e1e; padding: 15px; margin-top: 15px; border-radius: 8px; border-left: 4px solid #2979ff; line-height: 1.5; }
        .tab-buttons { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .tab-buttons button { width: auto; }
        .badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; margin-left: 5px; }
        .badge-offline { background: #00c853; color: #000; }
        .badge-online { background: #ff9100; color: #000; }
        #canvas-container { width: 100%; height: 400px; margin-top: 10px; border-radius: 8px; overflow: hidden; background: #000; }
    </style>
</head>
<body>
    <div class="tab-buttons">
        <button onclick="showTab('offline')">📴 Офлайн</button>
        <button onclick="showTab('online')">🔌 Онлайн</button>
        <button onclick="showTab('3d')">📦 3D</button>
    </div>

    <div id="offline" class="tab active">
        <h3>Алгебра <span class="badge badge-offline">Без Wi-Fi</span></h3>
        <input id="a" placeholder="a = 1"><br>
        <input id="b" placeholder="b = -5"><br>
        <input id="c" placeholder="c = 6"><br>
        <button class="offline" onclick="solveQuadratic()">Решить локально</button>
        <div id="alg-result" class="result">Ожидание ввода...</div>
    </div>

    <div id="online" class="tab">
        <h3>Анализ <span class="badge badge-online">Нужен интернет</span></h3>
        <input id="expr" placeholder="Функция: x**2 * sin(x)"><br>
        <button onclick="solveServer('calculus_derivative')">Производная</button>
        <button onclick="solveServer('calculus_integral')">Интеграл</button>
        <div id="online-result" class="result">Ожидание ввода...</div>
    </div>

    <div id="3d" class="tab">
        <h3>3D Фигуры <span class="badge badge-offline">Без Wi-Fi</span></h3>
        <button class="offline" onclick="drawSphere()">Сфера</button>
        <button class="offline" onclick="drawCube()">Куб</button>
        <button class="offline" onclick="drawCylinder()">Цилиндр</button>
        <div id="canvas-container"></div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === '3d') { resize3D(); }
        }

        function solveQuadratic() {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            const c = parseFloat(document.getElementById('c').value);
            let resultDiv = document.getElementById('alg-result');
            if (isNaN(a) || isNaN(b) || isNaN(c)) { resultDiv.innerHTML = "Ошибка: Введите числа!"; return; }
            
            const D = b*b - 4*a*c;
            let steps = `Дискриминант D = ${D}.<br>`;
            let answer = "";
            if (D > 0) {
                const x1 = (-b + Math.sqrt(D)) / (2*a);
                const x2 = (-b - Math.sqrt(D)) / (2*a);
                steps += "D > 0, два корня.<br>Формула: x = (-b ± √D) / 2a.";
                answer = `x₁ = ${x1.toFixed(4)}, x₂ = ${x2.toFixed(4)}`;
            } else if (D === 0) {
                const x = -b / (2*a);
                steps += "D = 0, один корень.<br>Формула: x = -b / 2a.";
                answer = `x = ${x.toFixed(4)}`;
            } else {
                steps += "D < 0, корней нет.";
                answer = "Корней нет";
            }
            resultDiv.innerHTML = `<b>📝 Теория:</b><br>${steps}<br><b>✅ Ответ:</b><br>${answer}`;
        }

        async function solveServer(type) {
            const expr = document.getElementById('expr').value;
            let resultDiv = document.getElementById('online-result');
            resultDiv.innerHTML = "🔄 Соединение с сервером...";
            try {
                const SERVER_URL = "https://ВАШ-АДРЕС.onrender.com/solve"; // СЮДА ВСТАВИМ ССЫЛКУ ПОЗЖЕ
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_type: type, data: { expr } })
                });
                if (!response.ok) throw new Error("Сервер недоступен");
                const res = await response.json();
                resultDiv.innerHTML = `<b>📝 Теория:</b> ${res.steps}<br><br><b>✅ Ответ:</b><br>${res.solution}`;
            } catch (e) {
                resultDiv.innerHTML = `<span style="color: #ff5252;">❌ Ошибка: Нет интернета или сервер недоступен.</span>`;
            }
        }

        let scene, camera, renderer, mesh;
        const container = document.getElementById('canvas-container');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 6);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0x404040));
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(10, 10, 10);
            scene.add(light);
            let isDragging = false;
            let prev = { x: 0, y: 0 };
            container.addEventListener('mousedown', (e) => { isDragging = true; });
            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                if(mesh) { mesh.rotation.y += (e.offsetX - prev.x) * 0.01; mesh.rotation.x += (e.offsetY - prev.y) * 0.01; }
                prev = { x: e.offsetX, y: e.offsetY };
            });
            container.addEventListener('mouseup', () => { isDragging = false; });
            container.addEventListener('touchstart', (e) => { isDragging = true; });
            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                let t = e.touches[0];
                if(mesh) { mesh.rotation.y += (t.clientX - prev.x) * 0.01; mesh.rotation.x += (t.clientY - prev.y) * 0.01; }
                prev = { x: t.clientX, y: t.clientY };
            });
            container.addEventListener('touchend', () => { isDragging = false; });
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (mesh) mesh.rotation.y += 0.005; 
            renderer.render(scene, camera);
        }
        function resize3D() {
            if (!renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        function clearScene() { if (mesh) scene.remove(mesh); }
        function drawSphere() { clearScene(); mesh = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 32), new THREE.MeshPhongMaterial({ color: 0x00aaff })); scene.add(mesh); }
        function drawCube() { clearScene(); mesh = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), new THREE.MeshPhongMaterial({ color: 0xff5500 })); scene.add(mesh); }
        function drawCylinder() { clearScene(); mesh = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 3, 32), new THREE.MeshPhongMaterial({ color: 0x00ff88 })); scene.add(mesh); }

        window.onload = () => { init3D(); drawSphere(); };
        window.onresize = resize3D;
    </script>
</body>
</html>
